[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arjax"
version = "2.0.0"
description = "Universal Linux Package Discovery & Installation Engine"
authors = [{ name="AdmGenSameer", email="sameers00324@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "requests",
  "rich",
  "typer[all]",
  "distro",
  "beautifulsoup4",
  "rapidfuzz>=3.0.0",
  "PyYAML",
  "textual>=0.80.0"
]

[project.optional-dependencies]
github = ["GitPython"]
gui = ["PyQt5>=5.15.0"]
tui = ["textual>=0.80.0"]
ml = ["scikit-learn>=1.3.0", "numpy>=1.24.0"]
all = ["GitPython", "PyQt5>=5.15.0", "textual>=0.80.0", "scikit-learn>=1.3.0", "numpy>=1.24.0"]

[project.scripts]
arjax = "arjax.interfaces.cli:main"
archpkg = "arjax.interfaces.cli:main"

[tool.setuptools]
packages = [
  "arjax",
  "arjax.interfaces",
  "arjax.search",
  "arjax.config",
  "arjax.package_management",
  "arjax.intelligence",
  "arjax.integrations",
  "arjax.installation",
  "arjax.system",
  "arjax.core",
  "arjax.recipes"
]

[tool.setuptools.package-data]
arjax = ["*.yaml", "*.yml", "recipes/*.yaml", "recipes/*.yml", "*.json", "templates/*.html", "templates/**/*"]

[tool.setuptools.data-files]
"share/applications" = ["arjax.desktop"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
